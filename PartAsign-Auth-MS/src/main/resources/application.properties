spring.application.name=PartAsign-Auth-MS

# Railway expone el puerto en la variable PORT; default 8080 en local
server.port=${PORT:8080}

# Usa variables de entorno para la BD en Railway (ajusta los nombres según el plugin)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Evita destruir datos en cada arranque; update es más seguro
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
