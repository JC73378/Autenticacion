spring.application.name=PartAsign-Auth-MS

# Railway expone el puerto en la variable PORT; default 8080 en local
server.port=${PORT:8080}

# Config DB: mapea los env que entrega Railway MySQL; defaults útiles en local
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:partsasign_auth}?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Evita destruir datos en cada arranque; update es más seguro
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
